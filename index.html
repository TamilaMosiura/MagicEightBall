<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="author" content="Tamila Mosiura">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Magic Eight Ball</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>~ Magic 8 Ball ~</h1>
  </header>

  <main>
    <section class="game-container">
      <div id="questionDisplay" class="question-display"></div>
      <div class="ball-display">
        <div class="magic-ball">
          <div class="ball-window">
            <p id="answer"></p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button onclick="askBall()" class="btn-primary">Ask the Ball</button>
      </div>

    </section>
  </main>

  <footer>
    <p>AI helped me to style the circle Magic 8 Ball</p>
  </footer>
  <script>
    // Magic Eight Ball Responses
    const responses = [
        "Yes, definitely!",
        "No, not at all.",
        "Ask again later.",
        "It is certain.",
        "I have doubts.",
        "Outlook good!",
        "Don't count on it.",
        "Signs point to yes."
    ];

    const askButton = document.getElementById('askButton');
    const answerDisplay = document.getElementById('answer');
    const questionDisplay = document.getElementById('questionDisplay');

    const defaultText = "Ask a yes or no question and receive your answer from this Magic Ball!";
    const defaultAnswer = "8: Ask a question...";
    questionDisplay.textContent = defaultText;
    answerDisplay.textContent = defaultAnswer;

    // Function to ask the ball
    function askBall() {
        const question = prompt("Ask the Magic Eight Ball your yes or no question:");

        // return if user cancels the prompt
        if (question === null) {
            answerDisplay.textContent = defaultAnswer;
            questionDisplay.textContent = defaultText;
            return;
        };

        if (question === "") {
            alert("Magic 8 Ball doesn't understand your question. Please ask again!");
            return;
        }

        questionDisplay.textContent = "Your question: " + question;

        const randomIndex = Math.floor(Math.random() * responses.length);
        const answer = responses[randomIndex];

        answerDisplay.textContent = answer;

        // I found I can use setTimeout to clear the answer run the game again in a loop
        setTimeout(() => {
            answerDisplay.textContent = "";
            questionDisplay.textContent = "";
            askBall();
        }, 1000);
    }

  </script>
</body>
</html>
