<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="author" content="Tamila Mosiura">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Magic Eight Ball</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1>~ Magic 8 Ball ~</h1>
  </header>

  <main>
    <section class="game-container">
      <div id="questionDisplay" class="question-display"></div>
      <div class="ball-display">
        <div class="magic-ball">
          <div class="ball-window">
            <p id="answer"></p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button onclick="askBall()" class="btn-primary">Ask the Ball</button>
      </div>

    </section>
  </main>

  <footer>
    <p>AI helped me to style the circle Magic 8 Ball</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
